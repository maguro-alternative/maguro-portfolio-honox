name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json の engines と揃える
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Vercel と Cloudflare の2系統を維持しているので、両方が壊れていないことを見る
      - name: Build (Vercel)
        run: npm run build

      - name: Build (Cloudflare)
        run: npm run build:cf
