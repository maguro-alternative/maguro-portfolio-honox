name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けて push したら、古い実行は止める。
# main はデプロイ途中で止めると本番確認とロールバックが走らないので止めない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 依存パッケージに乗っ取られた場合に GITHUB_TOKEN でリポジトリを書き換えられないようにする
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json の engines と揃える
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Vercel と Cloudflare の2系統を維持しているので、両方が壊れていないことを見る
      - name: Build (Vercel)
        run: npm run build

      - name: Build (Cloudflare)
        run: npm run build:cf

      # デプロイはこの成果物を使う。デプロイ側でビルドすると、ビルドで動く依存が
      # 同じジョブ内の wrangler を書き換えてトークンごと乗っ取れてしまう
      - name: Upload Cloudflare build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-cloudflare
          path: dist
          include-hidden-files: true
          retention-days: 1

  # Vercel は Git 連携で自動デプロイされるが、Cloudflare は手動だったので main への push で出す
  deploy-cloudflare:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Vercel が作る Production とは分ける。API トークンはこの environment の secret に置き、
    # main 以外のブランチのジョブからは読めないようにしてある
    environment:
      name: cloudflare-production
      url: https://maguro-alternative.com
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # トークンは wrangler を動かすステップにだけ渡す。ジョブ全体に置くと、
      # checkout などほかのステップからも読めてしまう
      - name: Record current version
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version=$(npx wrangler deployments status --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).versions[0].version_id))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "現在の版: $version"

      - uses: actions/download-artifact@v4
        with:
          name: dist-cloudflare
          path: dist

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test
        id: smoke
        run: npm run smoke -- https://maguro-alternative.com dist/.vite/manifest.json

      - name: Rollback
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.before.outputs.version }}
        run: |
          npx wrangler rollback "$PREVIOUS_VERSION" -y -m "smoke test failed: $GITHUB_SHA"
          npm run smoke -- https://maguro-alternative.com
