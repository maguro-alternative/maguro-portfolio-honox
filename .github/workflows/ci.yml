name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 依存パッケージに乗っ取られた場合に GITHUB_TOKEN でリポジトリを書き換えられないようにする
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json の engines と揃える
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Vercel と Cloudflare の2系統を維持しているので、両方が壊れていないことを見る
      - name: Build (Vercel)
        run: npm run build

      - name: Build (Cloudflare)
        run: npm run build:cf

      # 本番と同じ成果物を起動して確かめる。typecheck やビルドが通っても、
      # 配信やハイドレーションで壊れていることがあるため
      - name: Start Worker (wrangler dev)
        run: |
          npx wrangler dev --port 8787 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8787/ && exit 0; sleep 1; done
          cat wrangler-dev.log
          exit 1

      - name: Smoke test
        run: npm run smoke -- http://localhost:8787 dist/.vite/manifest.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            wrangler-dev.log
          retention-days: 7
