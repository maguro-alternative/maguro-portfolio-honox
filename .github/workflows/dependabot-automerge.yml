name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  automerge:
    # PR のコードは checkout しない。書き込み権限を持つジョブで依存のコードを動かさないため
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'maguro-alternative/maguro-portfolio-honox'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # merge されるのは check（ブランチ保護で必須）が通ってから。メジャー更新は人が見る
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask for review (major)
        if: github.event.action == 'opened' && steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr comment "$PR_URL" --body "メジャー更新のため自動 merge しません。破壊的変更を確認してから merge してください。"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
